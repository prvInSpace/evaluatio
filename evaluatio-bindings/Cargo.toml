[package]
name = "evaluatio-bindings"
version = "0.5.2"
edition = "2021"

[lib]
name = "_bindings"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "~0.25.0", features = [
    "extension-module",
    "abi3",
    "abi3-py38",
    "generate-import-lib",
] }
evaluatio-core = { path = "../evaluatio-core", features = ["python"] }
